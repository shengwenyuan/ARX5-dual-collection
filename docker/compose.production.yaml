name: arx5-dual-production

services:
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bringup
      target: production
      args:
        SOURCE_REVISION: "${ARX5_SOURCE_REVISION:-unknown}"
    image: ${ARX5_COLLECTOR_IMAGE:-arx5-dual-collection:production}
    privileged: true
    network_mode: host
    shm_size: "1gb"
    stdin_open: true
    tty: true
    stop_grace_period: 45s
    environment:
      ARX5_USBFS_MEMORY_MB: "256"
    volumes:
      - /run/udev:/run/udev:ro
      - /var/lib/arx5-collection:/var/lib/arx5-collection
      - ..:/workspace:ro
      - /home/lenovo/swy/reports:/home/lenovo/swy/reports
    command:
      - arx5-collect
      - run
      - --task-config
      - "${ARX5_TASK_CONFIG:-/workspace/config/task.eight-stream.json}"
      - --output-root
      - "${ARX5_OUTPUT_ROOT:-}"
      - --task-description
      - "${ARX5_TASK_DESCRIPTION:-}"
