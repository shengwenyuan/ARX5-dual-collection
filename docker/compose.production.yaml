name: arx5-dual-production

services:
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bringup
      target: production
    image: arx5-dual-collection:production
    privileged: true
    network_mode: host
    shm_size: "1gb"
    stdin_open: true
    tty: true
    stop_grace_period: 45s
    environment:
      ARX5_USBFS_MEMORY_MB: "256"
    volumes:
      - /run/udev:/run/udev:ro
      - /var/lib/arx5-collection:/var/lib/arx5-collection
      - ..:/workspace:ro
      - ../reports:/reports
    command:
      - arx5-collect
      - run
      - --task-config
      - /workspace/config/task.eight-stream.json
      - --output-root
      - ${ARX5_OUTPUT_ROOT:-/reports/episodes}
      - --session-log-root
      - /reports/session-logs
