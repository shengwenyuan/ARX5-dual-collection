name: arx5-dual-bringup

services:
  device-bringup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bringup
      target: bringup
    image: arx5-dual-bringup:dev
    container_name: arx5-bringup-w3
    init: true
    privileged: true
    network_mode: host
    shm_size: "1gb"
    stop_grace_period: 5s
    environment:
      ARX5_USBFS_MEMORY_MB: "256"
    volumes:
      - /run/udev:/run/udev:ro
      - ..:/workspace:ro
      - ../reports:/reports
