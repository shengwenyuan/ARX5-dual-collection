name: arx5-dual-dagger

services:
  policy-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.policy
    image: ${ARX5_DAGGER_POLICY_IMAGE:-arx5-dual-policy:dagger}
    gpus: all
    restart: "no"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${ARX5_DAGGER_POLICY_CONFIG:-/var/lib/arx5-collection/dagger-policy.toml}:/config/policy.toml:ro
      - ${ARX5_CHECKPOINT_ROOT:?set ARX5_CHECKPOINT_ROOT}:/checkpoints:ro
    healthcheck:
      test:
        - CMD
        - /.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bringup
      target: dagger-collector
    image: ${ARX5_DAGGER_COLLECTOR_IMAGE:-arx5-dual-collection:dagger}
    privileged: true
    network_mode: host
    shm_size: "1gb"
    stdin_open: true
    tty: true
    stop_grace_period: 45s
    depends_on:
      policy-server:
        condition: service_healthy
    environment:
      ARX5_USBFS_MEMORY_MB: "256"
    volumes:
      - /run/udev:/run/udev:ro
      - /var/lib/arx5-collection:/var/lib/arx5-collection
      - ${ARX5_DAGGER_POLICY_CONFIG:-/var/lib/arx5-collection/dagger-policy.toml}:/config/policy.toml:ro
      - ${ARX5_TASK_CONFIG:-../config/task.eight-stream.json}:/config/task.json:ro
      - ${ARX5_REPORT_ROOT:-../reports}:/reports
    command:
      - arx5-collect
      - dagger
      - ${ARX5_DAGGER_MODE:-takeover}
      - --policy-config
      - /config/policy.toml
      - --task-config
      - /config/task.json
      - --output-root
      - ${ARX5_OUTPUT_ROOT:-/reports/dagger-takeover}
      - --session-log-root
      - /reports/session-logs
