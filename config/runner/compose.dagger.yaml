name: arx5-dual-dagger

services:
  policy-server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.policy
    image: ${ARX5_DAGGER_POLICY_IMAGE:-arx5-dual-policy:dagger}
    gpus: all
    restart: "no"
    stop_grace_period: "${ARX5_POLICY_STOP_GRACE_PERIOD:-30s}"
    environment:
      ARX5_CONFIG_ROOT: /config/arx5
      ARX5_ENVIRONMENT_CONFIG: "${ARX5_ENVIRONMENT_CONFIG_CONTAINER:-/config/arx5/environment/default.toml}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${ARX5_CONFIG_ROOT_HOST:-..}:/config/arx5:ro
      - ${ARX5_DAGGER_POLICY_CONFIG:-/var/lib/arx5-collection/dagger-policy.toml}:/config/policy.toml:ro
      - ${ARX5_CHECKPOINT_ROOT:?set ARX5_CHECKPOINT_ROOT}:/checkpoints:ro
    healthcheck:
      test:
        - CMD
        - /.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  collector:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.bringup
      target: dagger-collector
      args:
        SOURCE_REVISION: "${ARX5_SOURCE_REVISION:-unknown}"
    image: ${ARX5_DAGGER_COLLECTOR_IMAGE:-arx5-dual-collection:dagger}
    privileged: true
    network_mode: host
    shm_size: "${ARX5_SHM_SIZE:-1gb}"
    stdin_open: true
    tty: true
    stop_grace_period: "${ARX5_STOP_GRACE_PERIOD:-45s}"
    depends_on:
      policy-server:
        condition: service_healthy
    environment:
      ARX5_CONFIG_ROOT: /config/arx5
      ARX5_ENVIRONMENT_CONFIG: "${ARX5_ENVIRONMENT_CONFIG_CONTAINER:-/config/arx5/environment/default.toml}"
      FASTDDS_DEFAULT_PROFILES_FILE: /config/arx5/environment/fastdds-shm.xml
    volumes:
      - /run/udev:/run/udev:ro
      - ${ARX5_STATION_DIR:-/var/lib/arx5-collection}:/var/lib/arx5-collection
      - ${ARX5_CONFIG_ROOT_HOST:-..}:/config/arx5:ro
      - ${ARX5_DAGGER_POLICY_CONFIG:-/var/lib/arx5-collection/dagger-policy.toml}:/config/policy.toml:ro
      - ${ARX5_COLLECTION_CONFIG:-../collection/fold-cloth-rgbd.toml}:/config/collection.toml:ro
      - ${ARX5_REPORTS_ROOT:-/home/lenovo/swy/reports}:${ARX5_REPORTS_ROOT:-/home/lenovo/swy/reports}
    command:
      - arx5-collect
      - dagger
      - ${ARX5_DAGGER_MODE:-takeover}
      - --policy-config
      - /config/policy.toml
      - --collection-config
      - /config/collection.toml
      - --output-root
      - "${ARX5_OUTPUT_ROOT:-}"
