schema_version = 2
name = "pi05-equal-eef-v3"
builder_backend = "lerobot-v2.1"
gripper_normalization = "linear_open_closed_0_1"
gripper_contract = "arx5-gripper-v1"

[[stages.episode_sanitycheck.units]]
type = "metadata_check"
params = {}

[[stages.episode_sanitycheck.units]]
type = "mcap_check"
params = {}

[[stages.episode_sanitycheck.units]]
type = "timeline_check"
params = { camera_gap_warning_ns = 67000000, arm_gap_warning_ns = 3000000 }

[[stages.episode_sanitycheck.units]]
type = "arm_signal_check"
params = {}

[[stages.episode_sanitycheck.units]]
type = "frame_alignment"
params = { cross_camera_tolerance_ns = 16700000, arm_max_age_ns = 2000000 }

[[stages.episode_sanitycheck.units]]
type = "alignment_report"
params = { grade_a_coverage = 0.99, grade_b_coverage = 0.95 }

[[stages.action_mining.units]]
type = "dagger_authority"
params = { monotonic_anchor_tolerance_ns = 1000, bag_anchor_tolerance_ns = 2000000 }

[[stages.action_mining.units]]
type = "episode_filter"
params = {}

[[stages.action_mining.units]]
type = "training_interval"
params = { max_episode_duration_s = 180.0 }

[[stages.action_mining.units]]
type = "equal_eef_action_sampler"
params = { eef_distance_m = 0.005, gripper_delta_threshold = 0.02, max_sample_interval_ns = 100000000, image_max_age_ns = 40000000, arm_max_age_ns = 2000000, action_horizon = 50, nominal_fps = 50 }

[[stages.action_mining.units]]
type = "motion_segmenter"
params = { idle_delta_threshold = 0.001, min_idle_frames = 24, min_motion_frames = 54, trim_segment_end_frames = 34 }

[[stages.action_mining.units]]
type = "trajectory_labeler"
params = {}

[[stages.dataset_generator.units]]
type = "lerobot_fragment_generator"
params = {}

[[stages.dataset_generator.units]]
type = "lerobot_fragment_validator"
params = {}

[[stages.dataset_generator.units]]
type = "lerobot_dataset_merge"
params = {}

[[stages.dataset_generator.units]]
type = "lerobot_dataset_validator"
params = {}
