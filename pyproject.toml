[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arx5-dual-collection"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
arx5-collect = "arx5_collection.production.cli:main"

[project.optional-dependencies]
test = ["jsonschema>=4.26,<5", "pytest>=8,<9"]
calibration = ["numpy>=2,<2.3", "opencv-python==4.12.0.88"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/arx5-collection/calibration" = ["config/calibration/X5.urdf"]
